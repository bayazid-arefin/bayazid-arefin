name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 06:00 Dhaka time
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/**"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-dark.svg stats-light.svg
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
